[package]
name = "metar-parser"
version = "0.0.0"
edition = "2021"
authors = ["Louis Adamian"]
description = "create a weather report toml file and short report from METARS downloaded from GOES"

[dependencies]
chrono = "0.4.40"
metar = "0.7.7"
toml = "0.8.20"
serde = { version = "1.0.218", features = ["derive"] }
clap = { version = "4.5.31", features = ["derive"] }
