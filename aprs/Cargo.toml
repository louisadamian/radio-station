[package]
name = "radio-station-aprs"
version = "0.1.0"
edition = "2024"

[dependencies]
aprs-parser = "0.4.2"
ax25 = "0.3.0"
kiss-tnc = "0.2.2"
tokio = { version = "1.44.1", features = ["rt", "rt-multi-thread", "macros", "time"] }
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }
chrono = "0.4.42"
clap = { version = "4.5.55", features = ["derive"] }
log = "0.4.29"
