[package]
name = "aprs"
authors = ["Louis Adamian"]
description = "writes APRS packets received from KISS over TCP to a JSON file for serving to Radio Station"
version = "0.1.0-alpha.1"
edition = "2024"
license = "GPL-3"

[dependencies]
aprs-parser = "0.4.2"
ax25 = "0.3.0"
kiss-tnc = "0.2.2"
tokio = { version = "1.44.1", features = ["rt", "rt-multi-thread", "macros"] }
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }
chrono = "0.4.42"
